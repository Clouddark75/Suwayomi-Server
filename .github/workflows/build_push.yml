
name: CI build

on:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (leave empty to build the branch selected in "Use workflow from")'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  check_wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

  build:
    name: Build Jar
    needs: check_wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          path: master
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Copy CI gradle.properties
        run: |
          cd master
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Build Jar
        env:
          ProductBuildType: "Preview"
        working-directory: master
        run: ./gradlew :server:shadowJar --stacktrace

      - name: Upload Jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: master/server/build/*.jar
          if-no-files-found: error

      - name: Upload icons
        uses: actions/upload-artifact@v7
        with:
          name: icon
          path: master/server/src/main/resources/icon
          if-no-files-found: error

      - name: Tar scripts dir to maintain file permissions
        run: tar -cvzf scripts.tar.gz -C master/ scripts/

      - name: Upload scripts.tar.gz
        uses: actions/upload-artifact@v7
        with:
          name: scripts
          path: scripts.tar.gz
          if-no-files-found: error

  jlink:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x64

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu

      - name: Package JDK
        run: |
          jlink --add-modules java.base,java.compiler,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.naming,java.prefs,java.scripting,java.se,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,jdk.attach,jdk.crypto.ec,jdk.jdi,jdk.management,jdk.net,jdk.unsupported,jdk.unsupported.desktop,jdk.zipfs,jdk.accessibility --output suwa --strip-debug --no-man-pages --no-header-files --compress=2

      - name: Upload JRE package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-jre
          path: suwa
          if-no-files-found: error

  bundle:
    name: Make ${{ matrix.name }} release
    needs: [build, jlink]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-all
            jre: linux-x64
          - name: appimage
            jre: linux-x64
          - name: linux-assets
            jre: linux-assets
          - name: linux-x64
            jre: linux-x64
          - name: macOS-x64
            jre: macOS-x64
          - name: macOS-arm64
            jre: macOS-arm64
          - name: windows-x64
            jre: windows-x64

    steps:
      - name: Download Jar
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: server/build

      - name: Download JRE
        uses: actions/download-artifact@v8
        if: matrix.name != 'linux-assets' && matrix.name != 'debian-all'
        with:
          name: ${{ matrix.jre }}-jre
          path: jre

      - name: Download icons
        uses: actions/download-artifact@v8
        with:
          name: icon
          path: server/src/main/resources/icon

      - name: Download scripts.tar.gz
        uses: actions/download-artifact@v8
        with:
          name: scripts

      - name: Make ${{ matrix.name }} release
        env:
          APPIMAGE_UPDATE_REPO: ${{ github.repository }}
        run: |
          mkdir upload
          tar -xvpf scripts.tar.gz
          scripts/bundler.sh -o upload/ ${{ matrix.name }}

      - name: Upload ${{ matrix.name }} release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: upload/*
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download Jar
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: release

      - name: Download debian-all
        uses: actions/download-artifact@v8
        with:
          name: debian-all
          path: release

      - name: Download appimage
        uses: actions/download-artifact@v8
        with:
          name: appimage
          path: release

      - name: Download linux-assets
        uses: actions/download-artifact@v8
        with:
          name: linux-assets
          path: release

      - name: Download linux-x64
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: release

      - name: Download macOS-x64
        uses: actions/download-artifact@v8
        with:
          name: macOS-x64
          path: release

      - name: Download macOS-arm64
        uses: actions/download-artifact@v8
        with:
          name: macOS-arm64
          path: release

      - name: Download windows-x64
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: release

      - name: Generate Tag Name
        id: GenTagName
        working-directory: release
        run: |
          jar_file=$(find . -maxdepth 1 -type f -name 'Suwayomi-Server-*.jar' -printf '%f\n' | head -n 1)

          if [ -z "$jar_file" ]; then
            echo "Suwayomi Server JAR not found."
            exit 1
          fi

          genTag="${jar_file#Suwayomi-Server-}"
          genTag="${genTag%.jar}"

          echo "$genTag"
          echo "value=$genTag" >> "$GITHUB_OUTPUT"

      - name: Checkout current repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: repository
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create Tag
        working-directory: repository
        env:
          TAG: ${{ steps.GenTagName.outputs.value }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Upload Preview Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.GenTagName.outputs.value }}
          name: ${{ steps.GenTagName.outputs.value }}
          files: release/*
